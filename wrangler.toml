# Cấu hình cho người tự cài (nút "Deploy to Cloudflare" hoặc `npm run deploy`).
# Bản hosted của tác giả dùng wrangler.hosted.toml.
name = "xteinklover"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Trang upload + bộ chuyển đổi chạy trên trình duyệt. Worker chạy trước để chặn Basic auth.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Không ghi id: Cloudflare tự tạo namespace KV lúc deploy lần đầu.
# KV free: 1 GB, value tối đa 25 MB, 1.000 ghi/ngày, không cần gắn thẻ như R2.
[[kv_namespaces]]
binding = "BOOKS"

[vars]
CATALOG_TITLE = "Xteink Lover"
MAX_UPLOAD_MB = "20"
